"$schema" = 'https://starship.rs/config-schema.json'

add_newline = false

format = """
[](red)\
$shlvl\
$shell\
[](fg:red bg:peach)\
$os\
$hostname\
$container\
[](fg:peach bg:yellow)\
$username\
[](fg:yellow bg:green)\
$directory\
[ ](fg:green bg:sapphire)\
$git_branch\
$git_commit\
$git_state\
$git_metrics\
$git_status\
[](fg:sapphire bg:lavender)\
$job\
$cmd_duration\
$status\
[ ](fg:lavender)\
$localip\
$singularity\
$kubernetes\
$nats\
$vcsh\
$fossil_branch\
$fossil_metrics\
$hg_branch\
$hg_state\
$pijul_channel\
$docker_context\
$package\
$bun\
$c\
$cmake\
$cobol\
$cpp\
$daml\
$dart\
$deno\
$dotnet\
$elixir\
$elm\
$erlang\
$fennel\
$fortran\
$gleam\
$golang\
$gradle\
$haskell\
$haxe\
$helm\
$java\
$julia\
$kotlin\
$lua\
$maven\
$mojo\
$nim\
$nodejs\
$ocaml\
$odin\
$opa\
$perl\
$php\
$pulumi\
$purescript\
$python\
$quarto\
$raku\
$rlang\
$red\
$ruby\
$rust\
$scala\
$solidity\
$swift\
$terraform\
$typst\
$vlang\
$vagrant\
$xmake\
$zig\
$buf\
$guix_shell\
$nix_shell\
$conda\
$pixi\
$meson\
$spack\
$memory_usage\
$aws\
$gcloud\
$openstack\
$azure\
$direnv\
$env_var\
$mise\
$crystal\
$sudo\
$battery\
$time\
$netns\
$line_break\
$character"""

right_format = """"""

palette = "catppuccin_mocha"

# -------------------------------- level 1
[shlvl]
disabled = false
threshold = 2
symbol = "󰘍 "
repeat = true
repeat_offset = 1
style = "bg:red fg:crust"
format = '[$symbol]($style)'

[shell]
disabled = false
style = "bg:red fg:crust"
format = '[$indicator ]($style)'

# -------------------------------- level 2
[os]
disabled = false
style = "bg:peach fg:crust"

[os.symbols]
Windows = ""
Ubuntu = "󰕈"
SUSE = ""
Raspbian = "󰐿"
Mint = "󰣭"
Macos = "󰀵"
Manjaro = ""
Linux = "󰌽"
Gentoo = "󰣨"
Fedora = "󰣛"
Alpine = ""
Amazon = ""
Android = ""
AOSC = ""
Arch = "󰣇"
Artix = "󰣇"
CentOS = ""
Debian = "󰣚"
Redhat = "󱄛"
RedHatEnterprise = "󱄛"

[hostname]
ssh_only = false
ssh_symbol = "󱘖 "
trim_at = "."
style = "bg:peach fg:crust"
format = "[$hostname$ssh_symbol ]($style)"

[container]
symbol = " "
format = "[$symbol$name ]($style)"
style = "bg:peach fg:crust"

# -------------------------------- level 3
[username]
show_always = true
style_user = "bg:yellow fg:crust"
style_root = "bg:yellow fg:red"
format = "[ $user ]($style)"

# -------------------------------- level 4
[directory]
truncation_length = 5
truncation_symbol = "…"
truncate_to_repo = false
use_os_path_sep = false
fish_style_pwd_dir_length = 1
style = "bg:green fg:crust"
before_repo_root_style = "bg:green fg:base"
repo_root_style = "bg:green fg:mantle"
repo_root_format = '[ $repo_root ]($repo_root_style)[󰉋 $path ]($style)'
format = "[󰉋 $path ]($style)"

[directory.substitutions]
"Documents" = "󰈙 "
"Downloads" = " "
"Music" = "󰝚 "
"Pictures" = " "
"Developer" = "󰲋 "

# -------------------------------- level 5
[git_branch]
disabled = false
style = "bg:sapphire fg:crust"
format = '[$symbol$branch(:$remote_branch) ]($style)'

[git_commit]
disabled = false
style = "bg:sapphire fg:crust"
format = '[\($hash$tag\) ]($style)'

[git_state]
disabled = false
style = "bg:sapphire fg:crust"
format = '\([$state( $progress_current/$progress_total) ]($style)\)'

[git_metrics]
disabled = false
added_style = "bg:sapphire fg:crust"
deleted_style = "bg:sapphire fg:crust"
format = '([+$added ]($added_style))([-$deleted ]($deleted_style))'

[git_status]
disabled = false
style = "bg:sapphire fg:crust"
format = '([\[$all_status$ahead_behind\] ]($style))'

# -------------------------------- level 6
[cmd_duration]
min_time = 0
show_milliseconds = true
show_notifications = false
min_time_to_notify = 60000
style = "bg:lavender fg:crust"
format = "[󱎫 $duration ]($style)"
disabled = false

[status]
disabled = false
symbol = " "
success_symbol = " "
signal_symbol = "󱐋 "
style = "bg:lavender fg:crust"
failure_style = "bg:red fg:crust bold"
format = "[$symbol$status$signal_name$maybe_int ]($style)"

# -------------------------------- prompt line
[character]
disabled = false
success_symbol = '[❯](bold fg:green)'
error_symbol = '[❯](bold fg:red)'
vimcmd_symbol = '[❮](bold fg:green)'
vimcmd_replace_one_symbol = '[❮](bold fg:lavender)'
vimcmd_replace_symbol = '[❮](bold fg:lavender)'
vimcmd_visual_symbol = '[❮](bold fg:yellow)'

# -------------------------------- other conditionals
[aws]
symbol = " "
format = '[$symbol ($profile)(\($region\) )(\[$duration\] )]($style)'

[buf]
symbol = " "

[c]
symbol = " "

[cmake]
symbol = " "

[conda]
symbol = " "

[crystal]
symbol = " "

[dart]
symbol = " "

[deno]
symbol = " "
format = '[$symbol($version )]($style)'

[docker_context]
symbol = " "

[elixir]
symbol = " "

[elm]
symbol = " "

[fennel]
symbol = " "

[fossil_branch]
symbol = " "

[gcloud]
symbol = "󱇶 "
format = '[$symbol$account(@$domain)(\($region\))]($style) '
detect_env_vars = ["CLOUDSDK_CORE_PROJECT"]

[golang]
symbol = " "

[guix_shell]
symbol = " "

[gradle]
symbol = " "
format = '[$symbol($version )]($style)'

[haskell]
symbol = " "

[haxe]
symbol = " "

[hg_branch]
symbol = " "

[java]
symbol = " "
detect_extensions = ['java', 'class', 'gradle', 'jar', 'cljs', 'cljc', 'mill']
format = '[${symbol}(${version} )]($style)'

[julia]
symbol = " "

[kotlin]
disabled = true
symbol = " "

[lua]
symbol = " "

[memory_usage]
symbol = "󰍛 "

[meson]
symbol = "󰔷 "

[mise]
format = '[$symbol$health]($style) '
healthy_symbol = "healthy"
unhealthy_symbol = "unhealthy"
disabled = true

[nim]
symbol = "󰆥 "

[nix_shell]
symbol = " "

[nodejs]
symbol = " "
format = '[$symbol($version )]($style)'

[ocaml]
symbol = " "

[package]
symbol = "󰏗 "
format = '[$symbol$version]($style) '

[perl]
symbol = " "

[php]
symbol = " "

[pijul_channel]
symbol = " "

[python]
symbol = " "

[rlang]
symbol = "󰟔 "

[ruby]
symbol = " "

[rust]
symbol = "󱘗 "
format = '[$symbol($version )]($style)'

[scala]
disabled = true
symbol = " "
format = '[${symbol}(${version} )]($style)'
detect_extensions = ['sbt', 'scala', 'mill']

[swift]
symbol = " "

[terraform]
symbol = " "
format = '[$symbol$version\($workspace\)]($style) '

[zig]
symbol = " "

