[settings]
browser = "/var/lib/flatpak/exports/bin/com.google.Chrome"

[games]

[profiles.infinitas]
run_profile = "gamescope"

[profiles.infinitas.common.env]
WINEPREFIX = "/home/atty/Games/konamate/infinitas"
GAMEID = "umu-infinitas"
PROTONPATH = "GE-Proton11-6-konaste"
OBS_VKCAPTURE = "1"
PIPEASIO_NUMBER_INPUTS = "0"
PIPEASIO_NUMBER_OUTPUTS = "2"
PIPEASIO_CONNECT_TO_HARDWARE = "on"
PIPEASIO_FIXED_BUFFERSIZE = "on"
PIPEASIO_PREFERRED_BUFFERSIZE = "64"
PIPEASIO_FOLLOW_DEVICE_CLOCK = "off"
PIPEASIO_SAMPLE_RATE = "44100"
PIPEASIO_RT_PRIORITY = "off"
PIPEASIO_CLIENT_NAME = "INFINITAS-PipeASIO"
DXVK_CONFIG = "d3d9.presentInterval=1"
RADV_DEBUG = "nodcc"

[[profiles.infinitas.common.registry]]
action = "set"
key = "HKLM\\Software\\ASIO\\XONAR SOUND CARD(64)"
name = "CLSID"
type = "string"
value = "{2D3CA9E2-1193-4C5D-B5FD-38798F3DC074}"

[[profiles.infinitas.common.registry]]
action = "set"
key = "HKLM\\Software\\ASIO\\XONAR SOUND CARD(64)"
name = "Description"
type = "string"
value = "XONAR SOUND CARD(64)"

[profiles.infinitas.entries.launcher]
command = "umu-run %r\\launcher\\modules\\bm2dx_launcher.exe %u"
registry = []

[profiles.infinitas.entries.launcher.env]

[profiles.infinitas.entries.game]
command = "umu-run %r\\game\\app\\bm2dx.exe -t %t"

[[profiles.infinitas.entries.game.registry]]
action = "set"
key = 'HKCU\Software\Wine\Explorer\Desktops'
name = "Default"
type = "string"
value = "1920x1080"

[[profiles.infinitas.entries.game.registry]]
action = "set"
key = 'HKCU\Software\Wine\X11 Driver'
name = "Managed"
type = "string"
value = "N"

[profiles.infinitas.entries.game.env]

[profiles.infinitas.entries.gamescope]
command = "gamescope --backend wayland -W 3840 -H 2160 -w 1920 -h 1080 -r 120 -S auto --rt -f -- env -u RADV_DEBUG umu-run %r\\game\\app\\bm2dx.exe --asio -t %t"

[[profiles.infinitas.entries.gamescope.registry]]
action = "delete"
key = 'HKCU\Software\Wine\Explorer\Desktops'
name = "Default"

[[profiles.infinitas.entries.gamescope.registry]]
action = "delete"
key = 'HKCU\Software\Wine\X11 Driver'
name = "Managed"

[profiles.infinitas.entries.gamescope.env]

[profiles.sdvx]
run_profile = "launcher"

[profiles.sdvx.common]
registry = []

[profiles.sdvx.common.env]
WINEPREFIX = "/home/atty/Games/konamate/sdvx"
GAMEID = "umu-sdvx"
PROTONPATH = "GE-Proton11-6-konaste"
OBS_VKCAPTURE = "1"
PIPEASIO_NUMBER_INPUTS = "0"
PIPEASIO_NUMBER_OUTPUTS = "2"
PIPEASIO_CONNECT_TO_HARDWARE = "on"
PIPEASIO_FIXED_BUFFERSIZE = "on"
PIPEASIO_PREFERRED_BUFFERSIZE = "64"
PIPEASIO_FOLLOW_DEVICE_CLOCK = "off"
PIPEASIO_SAMPLE_RATE = "44100"
PIPEASIO_RT_PRIORITY = "off"
PIPEASIO_CLIENT_NAME = "SDVX-PipeASIO"
DXVK_CONFIG = "d3d9.presentInterval=1"

[profiles.sdvx.entries.launcher]
command = "umu-run %r\\launcher\\modules\\launcher.exe %u"
registry = []

[profiles.sdvx.entries.launcher.env]

[profiles.sdvx.entries.game]
command = "mangohud umu-run %r\\game\\modules\\sv6c.exe -t %t"
registry = []

[profiles.sdvx.entries.game.env]

[profiles.sdvx.entries.gamescope]
command = "gamescope --backend wayland -W 2160 -H 3840 -w 1080 -h 1920 -r 120 -S auto --rt -f --mangoapp -- umu-run %r\\game\\modules\\sv6c.exe -t %t"
registry = []

[profiles.sdvx.entries.gamescope.env]
