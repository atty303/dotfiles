<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<fontconfig>
  <description>Define preferred fonts and rendering defaults</description>

  <match target="font">
    <test name="slant">
      <const>roman</const>
    </test>
    <test compare="not_eq" name="slant" target="pattern">
      <const>roman</const>
    </test>
    <edit mode="assign" name="matrix">
      <times>
        <name>matrix</name>
        <matrix>
          <double>1</double>
          <double>0.2</double>
          <double>0</double>
          <double>1</double>
        </matrix>
      </times>
    </edit>
    <edit mode="assign" name="slant">
      <const>oblique</const>
    </edit>
    <edit mode="assign" name="embeddedbitmap">
      <bool>false</bool>
    </edit>
  </match>

  <match target="font">
    <test compare="less_eq" name="weight">
      <const>medium</const>
    </test>
    <test compare="more_eq" name="weight" target="pattern">
      <const>bold</const>
    </test>
    <edit mode="assign" name="embolden">
      <bool>true</bool>
    </edit>
    <edit mode="assign" name="weight">
      <const>bold</const>
    </edit>
  </match>

  <match target="font">
    <edit mode="assign" name="hinting">
      <bool>true</bool>
    </edit>
    <edit mode="assign" name="hintstyle">
      <const>hintslight</const>
    </edit>
    <edit mode="assign" name="antialias">
      <bool>true</bool>
    </edit>
  </match>

  <alias binding="strong">
    <family>sans-serif</family>
    <prefer>
      <family>IBM Plex Sans JP</family>
      <family>Noto Sans CJK JP</family>
      <family>Noto Color Emoji</family>
    </prefer>
  </alias>

  <alias binding="strong">
    <family>serif</family>
    <prefer>
      <family>Noto Serif CJK JP</family>
      <family>Noto Serif</family>
      <family>Noto Color Emoji</family>
    </prefer>
  </alias>

  <alias binding="strong">
    <family>monospace</family>
    <prefer>
      <family>UDEV Gothic NFLG</family>
      <family>Noto Sans Mono CJK JP</family>
      <family>Noto Color Emoji</family>
    </prefer>
  </alias>

  <alias binding="strong">
    <family>emoji</family>
    <prefer>
      <family>Noto Color Emoji</family>
    </prefer>
  </alias>
</fontconfig>
